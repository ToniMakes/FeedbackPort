name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here: pnpm/action-setup reads the packageManager field in the root package.json,
      # because declaring it in two places makes the action refuse to start
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r lint

      - run: pnpm -r test

      # webpack resolves modules more strictly than tsc/vitest (esbuild/rollup). A relative import
      # with a .js suffix in packages/core once passed typecheck and tests but failed here;
      # keep this step so the same class of bug can't slip back in
      - run: pnpm --filter @feedbackport/web build

  # Guards the database permission boundary (see docs/decisions/0007-revoke-anon-data-access.md):
  # starts a throwaway local Supabase stack, applies every migration, then runs the pgTAP tests
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - run: supabase test db
